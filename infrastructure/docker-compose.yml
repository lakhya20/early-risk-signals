version: '3.9'
services:
  backend:
    build: ../backend
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/risks
    depends_on:
      - db
  frontend:
    build: ../frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: risks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
